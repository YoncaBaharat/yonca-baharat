<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Yonca Baharat - Sepet</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,sans-serif;
background:#f7f7f2;
color:#26372b;
}

header{
background:white;
border-bottom:1px solid #ddd;
position:sticky;
top:0;
z-index:1000;
}

.header{
max-width:1100px;
height:70px;
margin:auto;
padding:0 20px;
display:flex;
align-items:center;
justify-content:space-between;
}

.logo{
font-size:23px;
font-weight:bold;
color:#173f27;
text-decoration:none;
}

.logo span{color:#789653}

.geri{
text-decoration:none;
color:#173f27;
font-weight:bold;
}

.container{
max-width:1100px;
margin:35px auto;
padding:0 20px;
}

h1{
font-family:Georgia,serif;
font-size:36px;
}

.sepet{
display:grid;
grid-template-columns:1fr 360px;
gap:25px;
}

.kutu{
background:white;
border:1px solid #e2e6df;
border-radius:18px;
padding:20px;
}

.urun{
display:flex;
align-items:center;
gap:15px;
padding:15px 0;
border-bottom:1px solid #eee;
}

.urun:last-child{
border-bottom:0;
}

.urun img{
width:90px;
height:90px;
object-fit:contain;
background:#f2f4ee;
border-radius:10px;
}

.urun-bilgi{
flex:1;
}

.urun-bilgi strong{
display:block;
margin-bottom:7px;
}

.fiyat{
font-weight:bold;
color:#173f27;
}

.adet{
display:flex;
align-items:center;
gap:8px;
margin-top:10px;
}

.adet button{
width:30px;
height:30px;
border:1px solid #ddd;
background:white;
border-radius:7px;
cursor:pointer;
}

.sil{
border:0;
background:none;
color:#b44;
cursor:pointer;
}

.ozet h2{
margin-top:0;
font-family:Georgia,serif;
}

.satir{
display:flex;
justify-content:space-between;
margin:14px 0;
}

.indirim{
color:#43834d;
font-weight:bold;
}

.kargo{
color:#173f27;
font-weight:bold;
}

.toplam{
font-size:23px;
font-weight:bold;
border-top:1px solid #ddd;
padding-top:18px;
margin-top:18px;
}

.kupon{
display:flex;
gap:8px;
margin:20px 0;
}

.kupon input{
flex:1;
padding:12px;
border:1px solid #ccc;
border-radius:8px;
text-transform:uppercase;
}

.kupon button{
background:#173f27;
color:white;
border:0;
border-radius:8px;
padding:0 15px;
cursor:pointer;
}

#kuponMesaj{
font-size:13px;
margin-top:8px;
}

.odeme{
margin-top:20px;
}

.odeme label{
display:block;
padding:13px;
border:1px solid #ddd;
border-radius:9px;
margin:8px 0;
cursor:pointer;
}

.siparis{
width:100%;
padding:15px;
border:0;
border-radius:10px;
background:#173f27;
color:white;
font-size:16px;
font-weight:bold;
cursor:pointer;
margin-top:15px;
}

.whatsapp{
display:block;
width:100%;
padding:14px;
margin-top:10px;
border-radius:10px;
background:#25d366;
color:white;
text-align:center;
text-decoration:none;
font-weight:bold;
}

.bos{
text-align:center;
padding:50px 20px;
}

@media(max-width:800px){

.sepet{
grid-template-columns:1fr;
}

.header{
padding:0 12px;
}

.container{
padding:0 12px;
}

h1{
font-size:30px;
}

.urun img{
width:70px;
height:70px;
}

}
</style>
</head>

<body>

<header>
<div class="header">

<a href="index.html" class="logo">
🌿 Yonca <span>Baharat</span>
</a>

<a href="urunler.html" class="geri">
← Ürünlere Dön
</a>

</div>
</header>

<div class="container">

<h1>🛒 Sepetim</h1>

<div id="icerik"></div>

</div>

<script>

/* ÜRÜNLER */
const urunler={

holistrakt:{
ad:"HOLİSTRAKT - Enginar, Devedikeni ve Karahindiba İçeren Sıvı Ekstrat 250 ML",
fiyat:925,
resim:"images/holistrakt.jpg"
},

kantaroid:{
ad:"KANTA ROIT KREM 20 ML",
fiyat:190,
resim:"images/kantaroid.jpg"
},

akzer:{
ad:"Akzer Saf Nar Ekşisi",
fiyat:349,
resim:"images/akzer.jpg"
},

kudretnari:{
ad:"Aksu Vital Kudret Narı Ekstraktlı Macun 300 gr",
fiyat:600,
resim:"images/yeni-kudret-nari-83.jpg"
}

};

/* SEPET */
function sepetGetir(){

return JSON.parse(
localStorage.getItem("sepet")
)||[];

}

function sepetKaydet(sepet){

localStorage.setItem(
"sepet",
JSON.stringify(sepet)
);

}

/* KUPON */
let kuponAktif=false;

function kuponUygula(){

const input=document.getElementById("kupon");

const kod=input.value.trim().toUpperCase();

const mesaj=document.getElementById("kuponMesaj");

if(kod==="YONCA10"){

kuponAktif=true;

mesaj.style.color="#43834d";
mesaj.innerText="✓ YONCA10 kuponu uygulandı! %10 indirim kazandınız.";

}else{

kuponAktif=false;

mesaj.style.color="#b44";
mesaj.innerText="Geçersiz kupon kodu.";

}

goster();

}

/* ÜRÜN ADET */
function adetDegistir(id,miktar){

let sepet=sepetGetir();

let urun=sepet.find(x=>x.id===id);

if(!urun)return;

urun.adet+=miktar;

if(urun.adet<=0){

sepet=sepet.filter(x=>x.id!==id);

}

sepetKaydet(sepet);

goster();

}

/* ÜRÜN SİL */
function urunSil(id){

let sepet=sepetGetir();

sepet=sepet.filter(x=>x.id!==id);

sepetKaydet(sepet);

goster();

}

/* SEPETİ GÖSTER */
function goster(){

const sepet=sepetGetir();

const alan=document.getElementById("icerik");

if(sepet.length===0){

alan.innerHTML=`
<div class="kutu bos">

<h2>Sepetiniz boş 🛒</h2>

<p>Beğendiğiniz ürünleri sepete ekleyerek alışverişe başlayabilirsiniz.</p>

<a class="siparis"
href="urunler.html">
Ürünlere Git
</a>

</div>
`;

return;

}

let araToplam=0;

let urunHTML="";

sepet.forEach(x=>{

const urun=urunler[x.id];

if(!urun)return;

const toplam=urun.fiyat*x.adet;

araToplam+=toplam;

urunHTML+=`

<div class="urun">

<img src="${urun.resim}">

<div class="urun-bilgi">

<strong>${urun.ad}</strong>

<div class="fiyat">
${urun.fiyat.toLocaleString("tr-TR")} TL
</div>

<div class="adet">

<button onclick="adetDegistir('${x.id}',-1)">−</button>

<strong>${x.adet}</strong>

<button onclick="adetDegistir('${x.id}',1)">+</button>

<button class="sil"
onclick="urunSil('${x.id}')">
Sil
</button>

</div>

</div>

<div>
<strong>
${toplam.toLocaleString("tr-TR")} TL
</strong>
</div>

</div>

`;

});

/* İNDİRİM */
let indirim=0;

if(kuponAktif){

indirim=araToplam*0.10;

}

/* KARGO */

let kargo=0;

if(araToplam-indirim<1500){

kargo=93.05;

}

/* GENEL TOPLAM */

const genelToplam=
araToplam-indirim+kargo;

alan.innerHTML=`

<div class="sepet">

<div class="kutu">

${urunHTML}

</div>

<div class="kutu ozet">

<h2>Sipariş Özeti</h2>

<div class="satir">

<span>Ara Toplam</span>

<strong>
${araToplam.toLocaleString("tr-TR",{minimumFractionDigits:2})} TL
</strong>

</div>

${kuponAktif?`

<div class="satir indirim">

<span>Kupon İndirimi (%10)</span>

<strong>
-${indirim.toLocaleString("tr-TR",{minimumFractionDigits:2})} TL
</strong>

</div>

`:``}

<div class="satir kargo">

<span>Kargo</span>

<strong>

${kargo===0
?"ÜCRETSİZ"
:kargo.toLocaleString("tr-TR",{minimumFractionDigits:2})+" TL"}

</strong>

</div>

${araToplam-indirim<1500?`

<p style="font-size:12px;color:#777">
1500 TL ve üzeri siparişlerde kargo ücretsiz.
</p>

`:`

<p style="font-size:12px;color:#43834d">
✓ Kargonuz ücretsiz!
</p>

`}

<div class="kupon">

<input
id="kupon"
placeholder="Kupon kodu"
value="${kuponAktif?"YONCA10":""}">

<button onclick="kuponUygula()">
Uygula
</button>

</div>

<div id="kuponMesaj"></div>

<div class="toplam">

<div class="satir">

<span>Toplam</span>

<strong>
${genelToplam.toLocaleString("tr-TR",{minimumFractionDigits:2})} TL
</strong>

</div>

</div>

<div class="odeme">

<h3>Ödeme Yöntemi</h3>

<label>
<input type="radio" name="odeme" value="Kapıda Ödeme" checked>
🚚 Kapıda Ödeme
</label>

<label>
<input type="radio" name="odeme" value="Online Kart">
💳 Online Kart ile Ödeme
</label>

<label>
<input type="radio" name="odeme" value="WhatsApp">
💬 WhatsApp üzerinden Sipariş
</label>

</div>

<button
class="siparis"
onclick="siparisVer()">

Siparişi Tamamla

</button>

<a
class="whatsapp"
href="https://wa.me/905525102881"
target="_blank">

💬 WhatsApp'tan İletişime Geç

</a>

</div>

</div>

`;

}

/* SİPARİŞ */
function siparisVer(){

const secilen=
document.querySelector(
'input[name="odeme"]:checked'
);

if(!secilen)return;

const sepet=sepetGetir();

if(sepet.length===0){

alert("Sepetiniz boş.");

return;

}

const odeme=secilen.value;

if(odeme==="WhatsApp"){

let mesaj="Merhaba Yonca Baharat, sipariş vermek istiyorum.%0A%0A";

sepet.forEach(x=>{

const urun=urunler[x.id];

mesaj+=
"• "+urun.ad+
" x"+x.adet+
" - "+
(urun.fiyat*x.adet)+
" TL%0A";

});

if(kuponAktif){

mesaj+="%0A🎁 YONCA10 kuponu kullanılacak.";

}

mesaj+="%0AÖdeme: WhatsApp üzerinden";

window.open(
"https://wa.me/905525102881?text="+mesaj,
"_blank"
);

return;

}

if(odeme==="Online Kart"){

alert(
"Online kart ödeme altyapısı henüz bağlanmadı. Şimdilik WhatsApp veya kapıda ödeme kullanabilirsiniz."
);

return;

}

alert(
"✓ Siparişiniz hazırlandı! Kapıda ödeme seçildi. Siparişinizi WhatsApp üzerinden onaylayabilirsiniz."
);

window.open(
"https://wa.me/905525102881?text=Merhaba%2C%20Yonca%20Baharat%20sitemden%20kapıda%20ödeme%20ile%20sipariş%20vermek%20istiyorum.",
"_blank"
);

}

/* BAŞLAT */
goster();

</script>

</body>
</html>
